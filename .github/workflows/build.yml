name: Build MundoN App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Gerar EXE Windows
        run: |
          pyinstaller --onedir --windowed --name MundoN_Pesquisa MundoN_Pesquisa.py
          xcopy databases dist\MundoN_Pesquisa\databases\ /E /I /Y

      - name: Compactar Windows
        run: Compress-Archive -Path dist\MundoN_Pesquisa\* -DestinationPath MundoN_Pesquisa_Windows.zip

      - name: Enviar artifact Windows
        uses: actions/upload-artifact@v4
        with:
          name: MundoN_Pesquisa_Windows
          path: MundoN_Pesquisa_Windows.zip

  build-mac:
    runs-on: macos-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Gerar APP Mac
        run: |
          pyinstaller --onedir --windowed --name MundoN_Pesquisa MundoN_Pesquisa.py
          mkdir -p dist/MundoN_Pesquisa.app/Contents/Resources/databases
          cp -R databases/* dist/MundoN_Pesquisa.app/Contents/Resources/databases/ || true

      - name: Compactar APP Mac
        run: |
          cd dist
          zip -r ../MundoN_Pesquisa_Mac.zip MundoN_Pesquisa.app

      - name: Enviar artifact Mac
        uses: actions/upload-artifact@v4
        with:
          name: MundoN_Pesquisa_Mac
          path: MundoN_Pesquisa_Mac.zip
